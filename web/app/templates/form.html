<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Karta niezgodności — WUWER</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body>
  <!-- Pasek marki: wyłącznie logo firmy, wyrównane do lewej krawędzi kolumny
       treści. Wszystko poniżej trzyma się tej samej krawędzi — to jedyny
       powód, dla którego układ przestaje wyglądać na przypadkowy. -->
  <!-- Pasek marki jak w LDMB: logo i nazwa aplikacji obok siebie w jednej
       linii. Cały nagłówek to jeden wiersz — na tablecie każdy piksel nad
       formularzem to piksel mniej na treść. -->
  <header class="appbar">
    <div class="appbar-inner">
      <!-- Po lewej tożsamość TEJ aplikacji (znak + nazwa) — bo to jest główna
           informacja na ekranie i trzyma wspólną krawędź z formularzem.
           Marka firmy idzie na prawy koniec paska: mówi „czyja to aplikacja",
           czyli jest podpisem, a nie tytułem.
           alt="" przy znaku, bo nazwa obok niesie tę samą treść (czytnik
           ekranu ma przeczytać ją raz). -->
      <div class="app-id">
        <img class="app-mark" src="/static/icon-mark.png" alt="" width="26" height="26">
        <h1>Karta niezgodności</h1>
      </div>
      <span class="logo" role="img" aria-label="WUWER — conveying &amp; automation"></span>
    </div>
  </header>

  <main class="wrap">
    <form id="report-form" class="card" novalidate>
      <!-- Grupa 1: co się stało. Najpierw treść zgłoszenia, bo po to
           operator otwiera aplikację. -->
      <section class="group">
        <h2 class="group-title">Niezgodność</h2>

        <div class="field">
          <label for="shortDesc">Jaka niezgodność wystąpiła? <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="shortDesc" name="shortDesc" required
                 autocomplete="off" enterkeyhint="next">
        </div>

        <div class="field">
          <label for="detailedDesc">Szczegółowy opis problemu</label>
          <textarea id="detailedDesc" name="detailedDesc" rows="5"></textarea>
        </div>

        {% if photo_enabled %}
        <div class="field">
          <span class="label-static">Zdjęcia <span class="hint" id="photo-count"></span></span>
          <!-- capture="environment" otwiera tylny aparat na tablecie/telefonie,
               a na desktopie degraduje się do zwykłego wyboru pliku.
               multiple pozwala dobrać kilka plików naraz z galerii; kolejne
               zdjęcia z aparatu DOKŁADAJĄ się do listy (patrz app.js). -->
          <input type="file" id="photo" name="photo" accept="image/*"
                 capture="environment" multiple hidden>
          <label for="photo" class="btn btn-ghost" id="photo-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ico">
              <path d="M4 7h3l2-2h6l2 2h3v12H4z" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>Dodaj zdjęcie</span>
          </label>

          <ul id="gallery" class="gallery" hidden></ul>
        </div>
        {% endif %}
      </section>

      <!-- Grupa 2: gdzie i kto. Pola porządkowe — wypełniane po opisaniu wady,
           a numer projektu i numer rysunku stoją obok siebie, bo zwykle
           przepisuje się je z tego samego dokumentu. -->
      <section class="group">
        <h2 class="group-title">Identyfikacja</h2>

        <div class="row">
          <div class="field">
            <label for="projectName">Numer projektu</label>
            <input type="text" id="projectName" name="projectName" autocomplete="off">
          </div>
          <div class="field">
            <label for="productId">ID produktu / numer rysunku</label>
            <input type="text" id="productId" name="productId" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="reporterName">Imię i nazwisko</label>
          <input type="text" id="reporterName" name="reporterName" autocomplete="name">
        </div>
      </section>

      <div class="actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="lbl-idle">Zgłoś kartę</span>
          <span class="lbl-busy">Wysyłam…</span>
        </button>
      </div>
    </form>
  </main>

  <!-- role=status: czytniki ekranu ogłaszają wynik bez przechwytywania fokusu -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/static/app.js?v={{ asset_v }}" type="module"></script>
</body>
</html>
